# ==============================================================================
# Pipeline & Experiment Hyperparameters
# AI-Based Interview Preparation Assistant
# Phase 1 Pipeline: Question Bank Domain Classification Baseline
# ==============================================================================

base:
  project_name: "interview-assistant-mlops"
  random_state: 42
  log_level: "INFO"

data:
  source_dir: "data/source/CS-Fundamentals"
  raw_data_path: "data/raw/question_bank.csv"
  processed_data_dir: "data/processed"
  text_columns:
    question: "question"
    answer: null
  target_column: "domain"
  target_classes:
    0: "Computer Networks"
    1: "DBMS and SQL"
    2: "DSA"
    3: "HR / Behavioural"
    4: "OOP"
    5: "Operating Systems"
    6: "Software Engineering"
    7: "System Design"

split:
  test_size: 0.20
  validation_size: 0.10
  stratify: true
  random_state: 42

features:
  tfidf:
    max_features: 3000
    ngram_range: [1, 2]
    stop_words: "english"
    min_df: 1
    sublinear_tf: true
  engineered_features:
    include_length: true
    include_sentiment_placeholder: false

model:
  baseline:
    algorithm: "logistic_regression"
    c_param: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42
  comparison:
    algorithm: "random_forest"
    n_estimators: 100
    max_depth: 15
    random_state: 42

evaluation:
  primary_metric: "f1_macro"
  secondary_metrics:
    - "accuracy"
    - "f1_weighted"
    - "precision_weighted"
    - "recall_weighted"
  confusion_matrix: true
